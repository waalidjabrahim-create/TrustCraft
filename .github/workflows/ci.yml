name: TrustCraft CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check web app syntax
        run: node --check --input-type=module < app.js
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Lint and test Cloud Functions
        working-directory: functions
        run: |
          npm run lint
          npm test
